<g id="receive" data-node="rect" data-box="281,259,156,20"><rect x="281" y="259" width="156" height="20" fill="#FBF5E5" stroke="#333333" stroke-width="0.8"/><text x="359" y="272.4" font-size="10.4" text-anchor="middle" ><tspan font-family="SimSun">接收并解析回复</tspan></text></g>
